<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg));color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;touch-action:none;overflow:hidden}

.top{display:flex;gap:8px;justify-content:flex-end;width:min(100vw,calc((100dvh - 12px) * .5625))}
.top button{flex:none;width:40px;height:36px;font-size:17px;border-radius:12px;background:rgba(127,127,127,.2);color:var(--ink);border:1px solid rgba(127,127,127,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#stage{position:relative;line-height:0}
#pn{display:none;position:absolute;left:50%;top:53.2%;transform:translate(-50%,-50%);width:56%;height:7%;text-align:center;text-transform:uppercase;letter-spacing:.14em;font:700 clamp(16px,3.4dvh,24px) "Barlow Condensed","Arial Narrow",Arial,sans-serif;line-height:normal;color:#e9ecf1;background:rgba(255,255,255,.08);border:2px solid #36d6ff;border-radius:12px;outline:none;user-select:text;-webkit-user-select:text}
#pn::placeholder{color:#5b6472}
.top{display:none!important}
body.fs{gap:0}
body.fs canvas{width:min(100vw,calc(100dvh * .5625));border-radius:0}
body.fs .ctl{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%)}
body.fs .ctl button{opacity:.85}
body.fs .top{position:fixed;top:90px;right:calc(50vw - min(50vw,28dvh) + 8px);flex-direction:column;width:auto;z-index:2}
body.fs .top button{opacity:.8}
.ctl{display:flex;gap:10px;width:min(100vw,420px);padding:0 12px}
button{flex:1;height:64px;border:0;border-radius:14px;background:var(--btn);color:var(--btnink);font:700 24px "Barlow Condensed","Arial Narrow",Arial,sans-serif;letter-spacing:.04em}
button.b{flex:1.6;background:var(--acc);color:#04141a}
button:active,button.on{transform:scale(.96);filter:brightness(1.15)}

</style>
</head>

<div class="top"><button id="RD" aria-label="Radio">📻</button><button id="GA" aria-label="Garage">🎨</button><button id="FS" aria-label="Plein écran">⛶</button><button id="S" aria-label="Son">🔊</button><button id="T" aria-label="Jour ou nuit">☾</button></div>
<div id="stage"><canvas id="c" width="360" height="640" aria-label="Jeu Roadless"></canvas><input id="pn" maxlength="10" placeholder="PSEUDO" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Pseudo"></div>

<!-- Music: Neon Husky — "Contribution Run" — https://neonhusky.dev — licensed CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). Tracks re-encoded to mono 48 kbps for size. -->
<script>const HOMEIMG=new Image();HOMEIMG.src="assets/home.jpg";</script>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=360,H=640,LANES=4,RX=40,RW=280,LW=RW/LANES,PY=490;
const cx=l=>RX+LW*l+LW/2;
const COLORS=['#ff2d3d','#ffcf00','#1e6bff','#b020ff','#00c060','#ffffff'];
let best=0;try{best=+localStorage.getItem('rr_best')||0}catch(e){}
let s,boostHeld=false,last=0;
const TH=[{n:'Désert',d:'#e0a030',g:'#3a2a10'},{n:'Côte',d:'#1fc0a0',g:'#0a3a3a'},{n:'Ville',d:'#7a86a8',g:'#1a1a3a'},{n:'Texas',d:'#3fc04a',g:'#0f3a14'},{n:'Plage',d:'#f2d98a',g:'#4a3c24'}];
const SK=[{n:'Argent',c:'#cfd5dc',t:'#36d6ff',u:0},{n:'Rouge',c:'#e0453a',t:'#ff8a1f',u:1000},{n:'Néon',c:'#36d6ff',t:'#9ef0ff',u:3000},{n:'Or',c:'#e8c15a',t:'#ffd23f',u:6000},{n:'Noir',c:'#2b3039',t:'#ff3b5c',u:10000}];
const MP=[{k:'fl',n:3,t:'Faire 3 flips'},{k:'sj',n:2,t:'Sauter 2 Semi'},{k:'nm',n:8,t:'Frôler 8 voitures'},{k:'sm',n:6,t:'Écraser 6 voitures'},{k:'ob',n:12,t:'Ramasser 12 ⚡'},{k:'sc',n:2500,t:'Atteindre 2500 points'},{k:'lv',n:3,t:'Atteindre le niveau 3'},{k:'bn',n:3,t:'Ramasser 3 bonus'}];
let M=null,total=0,skin=0,tm='',tt=0;
const UP={bat:0,pro:0,flip:0,mg:0,shd:0};let pname='',HS=[];
const UL=[{k:'bat',n:'Batterie',d:'+10 de charge au départ'},{k:'pro',n:'Propulsion',d:'−10 % de consommation'},{k:'flip',n:'Flip',d:'−2 ⚡ de coût par niveau'},{k:'mg',n:'Aimant',d:'+25 % de durée'},{k:'shd',n:'Bouclier',d:'+25 % de durée'}];
const ucost=l=>500*(l+1),fcost=()=>15-2*UP.flip;
const dayKey=new Date().toISOString().slice(0,10);
function newM(){let h=0;for(const ch of dayKey)h=(h*31+ch.charCodeAt(0))>>>0;const pool=MP.slice(),list=[];for(let i=0;i<3;i++){h=(h*1103515245+12345)>>>0;const m=pool.splice(h%pool.length,1)[0];list.push({k:m.k,n:m.n,t:m.t,p:0,done:0})}return{d:dayKey,list:list}}
try{const o=JSON.parse(localStorage.getItem('rr_m'));if(o){total=o.total||0;skin=0;if(o.UP)Object.assign(UP,o.UP);pname=o.name||'';HS=o.hs||[];if(o.M&&o.M.d===dayKey)M=o.M}}catch(e){}
if(!M)M=newM();
function save(){try{localStorage.setItem('rr_m',JSON.stringify({M:M,total:total,skin:0,UP:UP,name:pname,hs:HS}))}catch(e){}}
function toast(m){tm=m;tt=200}
function stat(k,v,mx){for(const m of M.list){if(m.k!==k||m.done)continue;m.p=mx?Math.max(m.p,v):m.p+(v||1);if(m.p>=m.n){m.done=1;total+=500;save();toast('Mission réussie : '+m.t+' · +500');tone(600,1800,.3,'square',.08)}}}
function addScore(sc){if(sc<=0)return 0;const e={n:pname||'JOUEUR',s:sc};HS.push(e);HS.sort((a,b)=>b.s-a.s);HS=HS.slice(0,10);return HS.indexOf(e)+1}
function endRun(){const sc=Math.floor(s.score);total+=sc;s.rank=addScore(sc);save();if(s.rank===1)toast('Nouveau meilleur score !')}
function endRunOld(){const b=SK.filter(k=>k.u<=total).length;total+=Math.floor(s.score);save();const a=SK.filter(k=>k.u<=total).length;if(a>b)toast('Nouvelle voiture : '+SK[a-1].n)}
const BT={sh:{c:'#ffd23f',i:'🛡',d:420},mg:{c:'#ff5fa2',i:'🧲',d:480},sl:{c:'#8f7bff',i:'⏱',d:360},x2:{c:'#4cf08a',i:'×2',d:480}};
let night=matchMedia('(prefers-color-scheme: dark)').matches;
let tod=night?1:0,todT=tod;
function lc(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
function setTheme(){document.documentElement.dataset.theme=night?'dark':'light';document.getElementById('T').textContent=night?'☾':'☀'}
let AC=null,mute=false,eng,engG,shake=0;
let vibOn=true,optSel=-1;
function vib(p){if(!vibOn)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function audio(){if(AC){if(AC.state==='suspended')AC.resume();return}if(mute)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();eng=AC.createOscillator();eng.type='sawtooth';engG=AC.createGain();engG.gain.value=0;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;eng.connect(lp);lp.connect(engG);engG.connect(AC.destination);eng.start()}catch(e){AC=null}}
function tone(f1,f2,d,ty,v){if(!AC||mute)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,v,fq){if(!AC||mute)return;const n=Math.floor(AC.sampleRate*d),bf=AC.createBuffer(1,n,AC.sampleRate),a=bf.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const src=AC.createBufferSource(),g=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=fq||1500;g.gain.value=v||.3;src.buffer=bf;src.connect(lp);lp.connect(g);g.connect(AC.destination);src.start()}
function engine(){if(!AC||!engG)return;engG.gain.value=(mute||s.state!=='play')?0:.04;eng.frequency.value=45+s.speed*9+(s.boost?35:0)}
function lvlSfx(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,f,.18,'square',.07),i*110))}
const CH=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const mf=n=>440*Math.pow(2,(n-69)/12);
let step=0,nextT=0,hb=null;
function note(f,t,d,ty,v,fq){const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type=ty;o.frequency.value=f;lp.type='lowpass';lp.frequency.value=fq||1800;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(lp);lp.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.2)}
function hat(t){if(!hb){const n=Math.floor(AC.sampleRate*.05);hb=AC.createBuffer(1,n,AC.sampleRate);const a=hb.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n)}const src=AC.createBufferSource(),g=AC.createGain(),hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;g.gain.value=.05;src.buffer=hb;src.connect(hp);hp.connect(g);g.connect(AC.destination);src.start(t)}
function music(){if(!AC||mute)return;const sp=60/118/4;if(nextT<AC.currentTime)nextT=AC.currentTime+.05;
  while(nextT<AC.currentTime+.3){const j=step%16,ch=CH[Math.floor(step/16)%4];
    if(j%4===0)kick(nextT);
    if(j%4===2)hat(nextT);
    if(j%2===0)note(mf(ch[0]-24),nextT,sp*1.8,'sawtooth',.07,500);
    note(mf(ch[[0,1,2,1,2,1,0,2][j%8]]+12),nextT,sp*.9,'square',.03,2200);
    if(j===0)ch.forEach(n=>note(mf(n),nextT,sp*15,'triangle',.03));
    nextT+=sp;step++}}
const TR=[{n:'Initial Commit',f:'01-initial-commit'},{n:'First Push',f:'02-first-push'},{n:'Push to Origin',f:'03-push-to-origin'},{n:'Smooth Rebase',f:'04-smooth-rebase'},{n:'Detached HEAD Pursuit',f:'05-detached-head-pursuit'},{n:'Upstream Drift',f:'06-upstream-drift'},{n:'Nightly Build Sprint',f:'07-nightly-build-sprint'},{n:'Merging to Main Branch',f:'08-merging-to-main-branch'},{n:'Clean Commit Highway',f:'09-clean-commit-highway'},{n:'Staging Area Sunset',f:'10-staging-area-sunset'}];
let trk=0,curSt=-1,mAud=null;
function setStation(){curSt=trk;const t=TR[trk];if(!t.f)return;
  if(!mAud){mAud=new Audio();mAud.preload='auto';mAud.addEventListener('ended',()=>{trk=(trk+1)%TR.length;setStation()});
    document.addEventListener('visibilitychange',()=>{if(!mAud)return;if(document.hidden)mAud.pause();else if(!mute)mAud.play().catch(()=>{})})}
  mAud.src='assets/music/'+t.f+'.mp3';mAud.volume=mute?0:.55;mAud.play().catch(()=>{})}
function music2(){if(mAud)mAud.volume=mute?0:.55;if(AC&&TR[trk].f&&curSt!==trk)setStation();if(!AC||mute||TR[trk].f)return;const lv=Math.min(4,s.level),sp=60/(TR[trk].t+lv*7)/4;
  if(nextT<AC.currentTime)nextT=AC.currentTime+.05;
  while(nextT<AC.currentTime+.3){const j=step%16,ci=Math.floor(step/16)%4,ch=TR[trk].ch[ci],t=nextT;
    if(j%4===0)kick(t);
    if(lv>=2&&j===10)kick(t);
    if(j%4===2||(lv>=3&&j%2===1))hat(t);
    if(j%(lv>=3?2:4)===0)note(mf(ch[0]-24),t,sp*(lv>=3?1.6:3.5),'sawtooth',.075,450+lv*120);
    note(mf(ch[[0,1,2,1,2,1,0,2][j%8]]+12+(lv>=4&&j%8>=4?12:0)),t,sp*.9,TR[trk].w,.015+.006*lv,1800+lv*500);
    if(j===0){ch.forEach(n=>{note(mf(n),t,sp*15.5,'sawtooth',.018,900);note(mf(n+12),t,sp*15.5,'triangle',.03,1500)});if(ci===3)tone(180,1800,sp*16,'sawtooth',.025)}
    nextT+=sp;step++}}
setInterval(music2,100);
function reset(state){s={state:state,lane:1,px:cx(1),speed:6,charge:50+UP.bat*10,cars:[],orbs:[],off:0,score:0,spawn:350,boost:false,fx:[],t:0,air:0,level:1,banner:100,wasB:false,time:33+UP.bat*3,dd:0,nxt:17000,inv:0,combo:0,ct:0,pb:0,ot:0,msg:'',mt:0,p:{sh:0,mg:0,sl:0,x2:0}}}
reset('start');

function move(d){if(s.state!=='play')return;s.fd=d;s.lane=Math.max(0,Math.min(LANES-1,s.lane+d))}
function act(){audio();if(s.state==='garage'||s.state==='options')return;if(s.state==='over'&&s.t-s.ot<40)return;if(s.state!=='play'){reset('play')}}
function flip(){if(s.state==='play'&&s.air<=0&&s.charge>=fcost()){s.air=1;s.charge-=fcost();stat('fl');noise(.4,.25,2500);tone(200,600,.5,'triangle',.08);for(let i=0;i<12;i++)s.fx.push({x:s.px+(Math.random()-.5)*20,y:PY+30,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,a:1,c:'#e8fbff'})}}

function spawn(){
  const l=Math.floor(Math.random()*LANES);
  if(Math.random()<.28){const ks=Object.keys(BT);s.orbs.push({l:l,y:-700,t:Math.random()<.3?ks[Math.floor(Math.random()*ks.length)]:null})}
  else if(Math.random()<.22){s.cars.push({l:l,y:-700,v:4.4,c:COLORS[Math.floor(Math.random()*COLORS.length)],bike:1,tl:l})}
  else if(Math.random()<.18){s.cars.push({l:l,y:-780,v:1.8,c:'#e9ecf1',semi:1})}
  else{s.cars.push({wv:Math.random()<.25,l:l,y:-700,v:1.5+Math.random()*2,c:COLORS[Math.floor(Math.random()*COLORS.length)]})}
}

function hit(a,b,aw,ah,bw,bh){return Math.abs(a.x-b.x)<(aw+bw)/2&&Math.abs(a.y-b.y)<(ah+bh)/2}

function update(k){
  s.t+=k;
  if(s.state==='play'){for(const q in s.p)if(s.p[q]>0)s.p[q]-=k;if(s.p.sl>0)k*=.6;s.slip=0;s.time-=k/60;if(s.inv>0)s.inv-=k;if(s.time<=0){s.time=0;s.timeout=1;gameOver()}s.ct-=k;if(s.polT>0)s.polT-=k;if(s.ct<=0)s.combo=0;if(s.mt>0)s.mt-=k}
  if(s.state!=='play'){s.off=(s.off+3*k)%40;return}
  s.px+=(cx(s.lane)-s.px)*Math.min(1,.22*k);
  s.boost=boostHeld&&s.charge>0;
  if(s.boost&&!s.wasB)noise(.35,.2,3000);s.wasB=s.boost;
  if(s.air>0){s.air-=.018*k;if(s.air<=0){s.air=0;s.score+=100;addT(1);noise(.2,.3,900);vib(30);shake=6;for(let i=0;i<10;i++)s.fx.push({x:s.px,y:PY+20,vx:(Math.random()-.5)*6,vy:Math.random()*3,a:1,c:'#36d6ff'})}}
  const base=6+Math.min(4.5,(s.level-1)*.75);
  const target=s.boost?base+5:base;
  s.speed+=(target-s.speed)*.08*k;
  if(s.boost)s.charge=Math.max(0,s.charge-.45*(1-.1*UP.pro)*k);
  s.off=(s.off+s.speed*k)%40;
  s.score+=s.speed*k*(s.boost?.2:.1)*(s.p.x2>0?2:1);
  s.dd+=s.speed*k;if(s.dd>=s.nxt){const lv=s.level+1;s.nxt+=17000+3500*(lv-1);s.level=lv;s.banner=120;lvlSfx();todT=1-todT;const cb=Math.round((17000+3500*(lv-1))/((6+Math.min(4.5,(lv-1)*.75))*60)*.7);addT(cb);toast('CHECKPOINT +'+cb+' s')}
  if(s.banner>0)s.banner-=k;
  stat('sc',Math.floor(s.score),1);stat('lv',s.level,1);
  s.spawn-=s.speed*k;
  if(s.spawn<=0){spawn();s.spawn=Math.max(150,340-s.level*30)+Math.random()*120-s.speed*3}
  const P={x:s.px,y:PY};
  for(const o of s.orbs){if(o.x===undefined)o.x=cx(o.l);o.y+=s.speed*k;if(s.p.mg>0&&!o.t&&Math.abs(o.y-PY)<280){o.x+=(s.px-o.x)*.12*k;o.y+=(PY-o.y)*.06*k}
    if(hit(P,{x:o.x,y:o.y},30,56,18,18)){o.dead=1;if(o.t){stat('bn');addT(1.5);s.p[o.t]=BT[o.t].d*(o.t==='mg'?1+.25*UP.mg:o.t==='sh'?1+.25*UP.shd:1);s.score+=25;tone(500,1500,.25,'square',.08)}else{stat('ob');tone(660,1320,.12,'sine',.12);s.charge=Math.min(100,s.charge+22);s.score+=10}}}
  for(const q of s.cars){if(q.bike||q.wv||q.pol){if(q.bx===undefined){q.bx=cx(q.l);q.tl=q.l}if(!q.pol&&!q.sw&&q.y>-300&&q.y<200&&Math.random()<.02){q.sw=1;const dr=q.l===0?1:q.l===LANES-1?-1:(Math.random()<.5?-1:1);q.nt=q.l+dr;q.dir=dr;q.bl=70}if(q.bl>0){q.bl-=k;if(q.bl<=0)q.tl=q.nt}q.bx+=(cx(q.tl)-q.bx)*.05*k}if(q.pol){q.pt=(q.pt||0)+k;if(q.ph===0){q.v=s.speed+3.2;if(q.y<PY-260){q.ph=1;q.pt=0}}else if(q.ph===1){q.v=s.speed-1.4;if(q.pt<150)q.tl=s.lane;if(q.pt>520)q.ph=2}else q.v=s.speed+5;if(q.y<-900)q.dead=1}q.y+=(s.speed-q.v)*k;
    const hh=hit(P,{x:qx(q),y:q.y},28,54,q.bike?16:30,q.semi?124:q.bike?40:56);
    if(!q.bike&&Math.abs(qx(q)-s.px)<28&&q.y<PY-30&&q.y>PY-190)s.slip=1;
    const dxq=Math.abs(qx(q)-s.px);
    if(!q.nm&&!hh&&s.air<=0&&dxq>=(q.semi?31:q.bike?22:29)&&dxq<50&&Math.abs(q.y-PY)<(q.semi?70:45)){q.nm=1;stat('nm');s.combo++;addT(.7);if(s.combo>=4&&!(s.polT>0)&&!s.cars.some(z=>z.pol))spawnPolice();s.ct=150;const pts=15*s.combo;s.score+=pts;s.msg='Frôlé ×'+s.combo+'  +'+pts;s.mt=60;const cb=Math.min(s.combo,8);tone(700+cb*90,1200+cb*120,.1,'triangle',.1);vib(12)}
    if(s.air>0&&hh&&!q.j){q.j=1;if(q.semi)stat('sj');tone(880,1760,.15,'square',.08);s.score+=q.semi?300:100}

  txt('← →  voie     ↑  flip     ↓  turbo',418,17,'#8b94a3');
  x.fillStyle='rgba(255,255,255,.07)';rr(30,456,300,118,16);
  txt('MISSIONS DU JOUR',483,15,'#36d6ff');
  M.list.forEach((m,i)=>txt((m.done?'✓ ':'• ')+m.t+' ('+Math.min(m.p,m.n)+'/'+m.n+')',512+i*24,17,m.done?'#4cf08a':'#c4cad4'));
  txt(SK[skin].n+' · '+total+' pts',610,15,'#8b94a3');
}
function hud(){
  if(s.state==='play'||s.state==='over'){
    const hg=x.createLinearGradient(0,0,0,84);hg.addColorStop(0,'rgba(9,11,15,.75)');hg.addColorStop(1,'rgba(9,11,15,0)');x.fillStyle=hg;x.fillRect(0,0,W,84);
    txt(String(Math.floor(s.score)),38,34,'#e9ecf1','left');
    txt('Record '+best,38,22,'#8b94a3','right');
    if(s.state==='play'){txt('TEMPS',12,11,'#8b94a3');txt(String(Math.max(0,Math.ceil(s.time))),44,32,s.time<10?'#ff4f4f':'#ffd23f');{const pv=s.nxt-(17000+3500*(s.level-1)),fr=Math.max(0,Math.min(1,(s.dd-pv)/(s.nxt-pv)));x.fillStyle='rgba(255,255,255,.18)';rr(130,50,100,5,2);x.fillStyle='#4cf08a';rr(130,50,Math.max(3,100*fr),5,2)}}
    txt('Niv. '+s.level+' · '+TH[(s.level-1)%TH.length].n,64,20,'#8b94a3','right');
    if(s.state==='play'&&s.banner>0){x.globalAlpha=Math.min(1,s.banner/40);txt('NIVEAU '+s.level,200,56,'#36d6ff');txt(TH[(s.level-1)%TH.length].n,236,28,'#e9ecf1');x.globalAlpha=1}
    if(s.state==='play'&&s.mt>0){x.globalAlpha=Math.min(1,s.mt/20);txt(s.msg,110,28,'#ffb340');x.globalAlpha=1}
    x.fillStyle='rgba(255,255,255,.12)';rr(14,50,120,8,4);
    x.fillStyle=s.charge>25?'#36d6ff':'#ff6a3d';rr(14,50,120*s.charge/100,8,4);
    let bx=14;for(const q in s.p)if(s.p[q]>0){x.fillStyle=BT[q].c;rr(bx,62,26*Math.min(1,s.p[q]/BT[q].d)+4,5,2);bx+=40}
  }
  if(s.state==='start'){homeScreen()}
  if(s.state==='garage'){garageScreen()}
  if(s.state==='options'){optScreen()}
  if(false){
    x.fillStyle='rgba(9,11,15,.72)';x.fillRect(0,0,W,H);
    txt('ROADLESS',250,50,'#e9ecf1');
    txt('Esquivez le trafic.',292,26,'#8b94a3');
    txt('Ramassez ⚡ pour charger la propulsion.',322,22,'#8b94a3');
    txt('Propulsion active : vous écrasez tout.',348,22,'#36d6ff');
    txt('FLIP : kickflip par-dessus le trafic (15 ⚡)',374,22,'#ffb340');
    txt('Camions Semi : +300 si vous sautez dessus',400,22,'#ffb340');
    txt('Touchez l’écran pour démarrer',420,28,'#e9ecf1');
    txt('Bonus : 🛡 bouclier · 🧲 aimant · ⏱ ralenti · ×2',456,17,'#ffd23f');
    txt('Glissez ← → : voie · ↑ : flip · ↓ : turbo',486,17,'#8b94a3');
    txt('Missions du jour',524,20,'#e9ecf1');
    M.list.forEach((m,i)=>txt((m.done?'✓ ':'• ')+m.t+' ('+Math.min(m.p,m.n)+'/'+m.n+')',548+i*22,17,m.done?'#4cf08a':'#8b94a3'));
    txt('Voiture : '+SK[skin].n+' · '+total+' pts',620,17,'#8b94a3');
  }
  if(s.state==='over'){
    x.fillStyle='rgba(9,11,15,.72)';x.fillRect(0,0,W,H);
    overScreen();
    
    
    
  }
}

function loop(t){const k=Math.min(2.5,(t-last)/16.67||1);last=t;update(k);dist+=(s.state==='play'?s.speed*k:2*k);engine();draw();pn.style.display=s.state==='start'?'block':'none';requestAnimationFrame(loop)}
requestAnimationFrame(loop);

function bind(id,down,up){const e=document.getElementById(id);
  e.addEventListener('pointerdown',ev=>{ev.preventDefault();down();e.classList.add('on')});
  const u=()=>{up&&up();e.classList.remove('on')};
  e.addEventListener('pointerup',u);e.addEventListener('pointerleave',u);e.addEventListener('pointercancel',u)}
document.getElementById('T').addEventListener('click',()=>{todT=todT>.5?0:1});
document.getElementById('S').addEventListener('click',()=>{mute=!mute;document.getElementById('S').textContent=mute?'🔇':'🔊';if(!mute)audio()});
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('fs');
document.getElementById('FS').addEventListener('click',()=>{
  const d=document.documentElement,on=!document.body.classList.contains('fs');
  document.body.classList.toggle('fs',on);
  try{if(on&&d.requestFullscreen)d.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen()}catch(e){}
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('fs')});
document.getElementById('RD').addEventListener('click',()=>{audio();trk=(trk+1)%TR.length;step=0;nextT=0;setStation();toast('📻 '+TR[trk].n+(TR[trk].f?' · Neon Husky, CC BY 4.0':''))});
const pn=document.getElementById('pn');pn.value=pname;pn.addEventListener('input',()=>{pname=pn.value.toUpperCase().replace(/[^A-Z0-9 ]/g,'').slice(0,10);pn.value=pname;save()});
document.getElementById('GA').addEventListener('click',()=>{if(s.state==='start'||s.state==='over'){s.state='garage';return}if(s.state==='garage'){reset('start');return}return;const un=SK.map((k,i)=>i).filter(i=>SK[i].u<=total);skin=un[(un.indexOf(skin)+1)%un.length];save();const nx=SK.find(k=>k.u>total);toast(SK[skin].n+(nx?' · prochaine à '+nx.u+' pts':''))});
setTheme();let sw=null,hold=0;
c.addEventListener('pointerdown',e=>{if(s.state==='garage'){garageTap(e);return}if(s.state==='options'){optTap(e);return}if(s.state==='over'&&s.t-s.ot>=40){const r=c.getBoundingClientRect(),mh=menuHit((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H,584);if(mh){goMenu(mh);return}}if(s.state!=='start')act();else audio();sw={x:e.clientX,y:e.clientY,m:false,b:false};try{c.setPointerCapture(e.pointerId)}catch(_){}});
c.addEventListener('pointermove',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y,th=c.clientWidth*.09;
  if(Math.abs(dx)>th&&Math.abs(dx)>Math.abs(dy)){if(s.state==='start')station(dx>0?1:-1);else move(dx>0?1:-1);sw.x=e.clientX;sw.y=e.clientY;sw.m=true}
  else if(dy<-th*1.4&&Math.abs(dy)>Math.abs(dx)){flip();sw.x=e.clientX;sw.y=e.clientY;sw.m=true}
  else if(dy>th*1.4&&Math.abs(dy)>Math.abs(dx)){boostHeld=true;sw.b=true;sw.x=e.clientX;sw.y=e.clientY;sw.m=true}});
const swEnd=()=>{clearTimeout(hold);if(sw&&sw.b)boostHeld=false;sw=null};
c.addEventListener('pointerup',e=>{if(s.state==='start'&&sw&&!sw.m)homeTap(e);swEnd()});c.addEventListener('pointercancel',swEnd);

addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='pn'){if(e.key==='Enter')e.target.blur();return}
  if(e.repeat)return;
  if(e.key==='ArrowLeft'||e.key==='a'){act();move(-1)}
  else if(e.key==='ArrowRight'||e.key==='d'){act();move(1)}
  else if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();act();boostHeld=true}
  else if(e.key==='f'||e.key==='ArrowDown'){e.preventDefault();act();flip()}
});
addEventListener('keyup',e=>{if(e.key===' '||e.key==='ArrowUp')boostHeld=false});
</script>
