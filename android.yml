# Ecrit en JSON (valide en YAML) : les espaces au debut des lignes n'ont aucune importance.
{
 "name": "Android (APK + AAB)",
 "on": {
  "push": {
   "branches": [
    "main"
   ]
  },
  "pull_request": {},
  "workflow_dispatch": {}
 },
 "jobs": {
  "build": {
   "runs-on": "ubuntu-latest",
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "uses": "actions/setup-java@v4",
     "with": {
      "distribution": "temurin",
      "java-version": "17"
     }
    },
    {
     "uses": "android-actions/setup-android@v3"
    },
    {
     "uses": "gradle/actions/setup-gradle@v4",
     "with": {
      "gradle-version": "8.9"
     }
    },
    {
     "name": "Preparer la cle de signature",
     "env": {
      "KEYSTORE_B64": "${{ secrets.KEYSTORE_BASE64 }}"
     },
     "run": "if [ -n \"$KEYSTORE_B64\" ]; then\n  echo \"$KEYSTORE_B64\" | base64 -d > \"$RUNNER_TEMP/upload.jks\"\n  echo \"KEYSTORE_FILE=$RUNNER_TEMP/upload.jks\" >> \"$GITHUB_ENV\"\nfi\n"
    },
    {
     "name": "Construire APK debug + AAB release",
     "working-directory": "android",
     "env": {
      "VERSION_CODE": "${{ github.run_number }}",
      "KEYSTORE_PASSWORD": "${{ secrets.KEYSTORE_PASSWORD }}",
      "KEY_ALIAS": "${{ secrets.KEY_ALIAS }}",
      "KEY_PASSWORD": "${{ secrets.KEY_PASSWORD }}"
     },
     "run": "gradle assembleDebug bundleRelease --no-daemon --stacktrace"
    },
    {
     "name": "Publier APK",
     "uses": "actions/upload-artifact@v4",
     "with": {
      "name": "roadless-debug-apk",
      "path": "android/app/build/outputs/apk/debug/*.apk"
     }
    },
    {
     "name": "Publier AAB",
     "uses": "actions/upload-artifact@v4",
     "with": {
      "name": "roadless-release-aab",
      "path": "android/app/build/outputs/bundle/release/*.aab"
     }
    }
   ]
  }
 }
}
